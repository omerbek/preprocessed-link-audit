name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fragments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --locked -p lychee --features check_example_domains --test cli preprocessed_fragment_targets
      - run: cargo test --locked -p lychee-lib --lib
      - run: cargo build --locked -p lychee
